<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TS Game Template</title>
    <link rel="icon" href="data:," />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body,
      #app-3d {
        width: 100%;
        height: 100vh;
        overflow: hidden;
        background: #000;
      }
      /* Overlay/HUD layer: stacked over the canvas, same footprint.
         pointer-events is none by default so it never blocks pointer-lock
         mouse-look; individual mounted overlay elements re-enable
         pointer-events on themselves. */
      #overlay-root {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100vh;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app-3d"></div>
    <div id="overlay-root"></div>
    <script type="module" src="/src/runtime/main.ts"></script>
  </body>
</html>
